# Dependabot: controllo settimanale degli aggiornamenti dei pacchetti Python e delle GitHub Actions.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Aggiornamenti minori e patch in una sola PR, quelli maggiori separati
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
