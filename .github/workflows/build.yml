name: Test e build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa le dipendenze
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Crea l'eseguibile
        run: python build.py
      - name: Comprimi l'app per macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/MassiveRenamer.app dist/MassiveRenamer-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MassiveRenamer-${{ runner.os }}
          path: |
            dist/MassiveRenamer.exe
            dist/MassiveRenamer-macOS.zip
          if-no-files-found: error
