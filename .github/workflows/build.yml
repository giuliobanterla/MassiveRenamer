# Test e creazione degli eseguibili su ogni piattaforma supportata.
name: Test e build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # usato da release.yml
    inputs:
      sign:
        description: Firma e notarizza l'app per macOS
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # La notarizzazione aspetta Apple: la prima può richiedere mezz'ora
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
          - name: macos-arm64
            os: macos-26
          - name: macos-x64
            os: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installa le dipendenze
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Carica le immagini dell'interfaccia
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.name }}
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Importa il certificato Developer ID
        if: runner.os == 'macOS' && inputs.sign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::Segreto MACOS_CERTIFICATE assente: l'app avrà solo la firma ad-hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Installa Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Crea l'eseguibile
        env:
          APPLE_ID: ${{ inputs.sign && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ inputs.sign && secrets.APPLE_APP_PASSWORD || '' }}
        run: python build.py

      - name: Prova l'app e il .dmg (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          # Sul runner Intel il servizio delle icone di macOS a volte non risponde a nessun programma, e
          # l'attivazione della finestra resterebbe ferma: in quel caso si salta il ciclo eventi
          if ! perl -e 'alarm 20; exec @ARGV' osascript -l JavaScript -e 'ObjC.import("AppKit"); $.NSWorkspace.sharedWorkspace.iconForContentType($.UTTypeFolder); ""'; then
            echo "::warning::Il servizio delle icone di macOS non risponde: self-test senza ciclo eventi"
            export MASSIVERENAMER_SELFTEST_SKIP_EVENTS=1
          fi
          dist/MassiveRenamer.app/Contents/MacOS/MassiveRenamer --self-test
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/MassiveRenamer.dmg
          test "$(readlink "$mnt/Applications")" = /Applications
          "$mnt/MassiveRenamer.app/Contents/MacOS/MassiveRenamer" --self-test
          hdiutil detach "$mnt"

      - name: Prova gli eseguibili e l'installer (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          function SelfTest($exe) {
            $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "self-test fallito per ${exe}: codice $($p.ExitCode)" }
          }
          SelfTest dist/MassiveRenamer-portable.exe
          SelfTest dist/MassiveRenamer/MassiveRenamer.exe

          # Installazione silenziosa, come fa l'aggiornamento automatico, in una cartella di prova
          $dir = Join-Path $env:RUNNER_TEMP 'MassiveRenamer'
          $p = Start-Process -FilePath dist/MassiveRenamer-setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", '/TASKS=contextmenu'
          if ($p.ExitCode -ne 0) { throw "installer fallito: codice $($p.ExitCode)" }
          $exe = Join-Path $dir 'MassiveRenamer.exe'
          if (-not (Test-Path (Join-Path $dir 'unins000.exe'))) { throw 'disinstallatore assente' }
          SelfTest $exe
          $key = 'HKCU:\Software\Classes\Directory\shell\MassiveRenamer\command'
          $command = (Get-ItemProperty -LiteralPath $key).'(default)'
          if ($command -ne "`"$exe`" `"%1`"") { throw "voce del tasto destro errata: $command" }

          # Il disinstallatore si copia in una cartella temporanea e termina subito: si aspetta che finisca
          Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw 'disinstallazione non completata' }
          for ($i = 0; $i -lt 10 -and (Test-Path -LiteralPath $key); $i++) { Start-Sleep 1 }
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\Directory\shell\MassiveRenamer') { throw 'voce del tasto destro rimasta' }
          Write-Output 'installer ok'

      - name: Prepara i file per macOS
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/MassiveRenamer.app dist/MassiveRenamer-${{ matrix.name }}.zip
          mv dist/MassiveRenamer.dmg dist/MassiveRenamer-${{ matrix.name }}.dmg

      - name: Carica l'eseguibile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MassiveRenamer-${{ matrix.name }}
          path: |
            dist/MassiveRenamer-portable.exe
            dist/MassiveRenamer-setup.exe
            dist/MassiveRenamer-${{ matrix.name }}.zip
            dist/MassiveRenamer-${{ matrix.name }}.dmg
          if-no-files-found: error
          retention-days: 14
