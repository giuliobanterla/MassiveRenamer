[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "massiverenamer"
dynamic = ["version"]
description = "Rinomina molti file in una volta, su Windows e macOS"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["PySide6>=6.6", "certifi"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.gui-scripts]
massiverenamer = "massiverenamer.gui:main"

[tool.setuptools]
packages = ["massiverenamer"]

[tool.setuptools.package-data]
massiverenamer = ["resources/*.png"]

[tool.setuptools.dynamic]
version = { attr = "massiverenamer.__version__" }
